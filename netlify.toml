# Netlify configuration for True Tech Team landing app
# Using Next.js runtime for server-side features (authentication, API routes)

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/storybook/*"
  to = "https://truetechteamcomponents.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/storybook"
  to = "https://truetechteamcomponents.netlify.app/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
