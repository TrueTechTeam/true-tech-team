# Netlify configuration for True Tech Team landing app
# Using Next.js runtime for server-side features (authentication, API routes)

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # NEXT_PUBLIC_* vars are intentionally bundled into client-side JS by Next.js (public anon
  # key by design) - Netlify's secret scanner otherwise flags them as "leaked" since their
  # values legitimately appear in the .next build output.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_STORYBOOK_URL"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/storybook/*"
  to = "https://truetechteamcomponents.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/storybook"
  to = "https://truetechteamcomponents.netlify.app/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
